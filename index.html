<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autograd Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Autograd demo</h1>
<p>Training a single neuron to learn y = 2x + 1. Results appear below and in the browser console.</p>
<pre id="output">Running...</pre>

<script>
class Value {
  constructor(data, children = [], op = "") {
    this.data = Number(data);
    this.grad = 0;
    this._backward = () => {};
    this._prev = new Set(children);
    this._op = op;
  }

  static wrap(x) {
    return x instanceof Value ? x : new Value(x);
  }

  add(other) {
    other = Value.wrap(other);
    const out = new Value(this.data + other.data, [this, other], "+");
    out._backward = () => {
      this.grad += out.grad;
      other.grad += out.grad;
    };
    return out;
  }

  mul(other) {
    other = Value.wrap(other);
    const out = new Value(this.data * other.data, [this, other], "*");
    out._backward = () => {
      this.grad += other.data * out.grad;
      other.grad += this.data * out.grad;
    };
    return out;
  }

  pow(exponent) {
    const out = new Value(Math.pow(this.data, exponent), [this], `**${exponent}`);
    out._backward = () => {
      this.grad += exponent * Math.pow(this.data, exponent - 1) * out.grad;
    };
    return out;
  }

  relu() {
    const out = new Value(Math.max(0, this.data), [this], "relu");
    out._backward = () => {
      this.grad += (out.data > 0 ? 1 : 0) * out.grad;
    };
    return out;
  }

  exp() {
    const out = new Value(Math.exp(this.data), [this], "exp");
    out._backward = () => {
      this.grad += out.data * out.grad;
    };
    return out;
  }

  log() {
    const out = new Value(Math.log(this.data), [this], "log");
    out._backward = () => {
      this.grad += (1 / this.data) * out.grad;
    };
    return out;
  }

  neg() { return this.mul(-1); }
  sub(other) { return this.add(Value.wrap(other).neg()); }
  div(other) { return this.mul(Value.wrap(other).pow(-1)); }

  backward() {
    const topo = [];
    const visited = new Set();
    const build = (v) => {
      if (!visited.has(v)) {
        visited.add(v);
        for (const child of v._prev) build(child);
        topo.push(v);
      }
    };
    build(this);
    this.grad = 1;
    for (let i = topo.length - 1; i >= 0; i--) {
      topo[i]._backward();
    }
  }
}

// Demo: learn y = 2x + 1 with gradient descent
const log = [];
const w = new Value(0);
const b = new Value(0);
const data = [[1, 3], [2, 5], [3, 7], [4, 9]];
const lr = 0.01;

for (let step = 0; step < 2000; step++) {
  let loss = new Value(0);
  for (const [x, y] of data) {
    const pred = w.mul(x).add(b);
    loss = loss.add(pred.sub(y).pow(2));
  }
  loss = loss.mul(1 / data.length);

  w.grad = 0;
  b.grad = 0;
  loss.backward();
  w.data -= lr * w.grad;
  b.data -= lr * b.grad;

  if (step % 500 === 0) {
    log.push(`step ${String(step).padStart(4)}  loss ${loss.data.toFixed(6)}`);
  }
}

log.push(`learned w=${w.data.toFixed(3)} (target 2), b=${b.data.toFixed(3)} (target 1)`);
document.getElementById("output").textContent = log.join("\n");
console.log(log.join("\n"));
</script>
</body>
</html>
