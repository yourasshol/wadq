<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tiny English Chat Model</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2em auto; padding: 0 1em; }
  textarea { width: 100%; height: 120px; font-family: monospace; }
  #chat { border: 1px solid #ccc; height: 260px; overflow-y: auto; padding: 8px; white-space: pre-wrap; background: #fafafa; }
  #log { font-family: monospace; font-size: 12px; background: #111; color: #0f0; height: 140px; overflow-y: auto; padding: 6px; white-space: pre-wrap; }
  input[type=text] { width: 75%; padding: 6px; }
  button { padding: 6px 12px; }
  .row { margin: 8px 0; }
</style>
</head>
<body>
<h2>Tiny English Chat Model</h2>
<p>A character-level neural network (256 hidden units) trained from scratch with a custom autograd engine. Click Train, wait for it to finish, then chat.</p>

<div class="row">
  <button id="trainBtn">Train</button>
  <span id="status">Not trained</span>
</div>
<div id="log"></div>

<div class="row">
  <div id="chat"></div>
</div>
<div class="row">
  <input type="text" id="msg" placeholder="Say something..." disabled>
  <button id="sendBtn" disabled>Send</button>
</div>
<div class="row">
  Temperature: <input type="range" id="temp" min="0.2" max="1.5" step="0.05" value="0.7">
  <span id="tempVal">0.7</span>
</div>

<script>
// ---------- Autograd engine ----------
class Value {
  constructor(data, children = [], op = '') {
    this.data = data;
    this.grad = 0;
    this._prev = children;
    this._back = () => {};
    this._op = op;
  }
  add(o) {
    o = o instanceof Value ? o : new Value(o);
    const out = new Value(this.data + o.data, [this, o], '+');
    out._back = () => { this.grad += out.grad; o.grad += out.grad; };
    return out;
  }
  mul(o) {
    o = o instanceof Value ? o : new Value(o);
    const out = new Value(this.data * o.data, [this, o], '*');
    out._back = () => { this.grad += o.data * out.grad; o.grad += this.data * out.grad; };
    return out;
  }
  pow(n) {
    const out = new Value(Math.pow(this.data, n), [this], '**');
    out._back = () => { this.grad += n * Math.pow(this.data, n - 1) * out.grad; };
    return out;
  }
  relu() {
    const out = new Value(this.data > 0 ? this.data : 0, [this], 'relu');
    out._back = () => { this.grad += (this.data > 0 ? 1 : 0) * out.grad; };
    return out;
  }
  log() {
    const out = new Value(Math.log(this.data), [this], 'log');
    out._back = () => { this.grad += (1 / this.data) * out.grad; };
    return out;
  }
  exp() {
    const out = new Value(Math.exp(this.data), [this], 'exp');
    out._back = () => { this.grad += out.data * out.grad; };
    return out;
  }
  neg() { return this.mul(-1); }
  sub(o) { return this.add(o instanceof Value ? o.neg() : -o); }
  div(o) { return this.mul(o instanceof Value ? o.pow(-1) : 1 / o); }

  backward() {
    const topo = [];
    const visited = new Set();
    const build = (v) => {
      if (visited.has(v)) return;
      visited.add(v);
      for (const c of v._prev) build(c);
      topo.push(v);
    };
    build(this);
    this.grad = 1;
    for (let i = topo.length - 1; i >= 0; i--) topo[i]._back();
  }
}

// ---------- Corpus ----------
const CORPUS = `
User: hello
Bot: hello, how are you today?
User: i am good, thank you
Bot: that is great to hear.
User: what is your name
Bot: i am a tiny model that learns from text.
User: how are you
Bot: i am happy to talk with you.
User: what is your favorite color
Bot: i like blue. blue is like the sky.
User: what do you like to do
Bot: i like to read stories and talk with friends.
User: tell me a story
Bot: once upon a time there was a small dog. the dog liked to run in the park.
User: what did the dog do
Bot: the dog ran and played with a red ball all day.
User: good morning
Bot: good morning. i hope you have a nice day.
User: good night
Bot: good night. sleep well and dream of nice things.
User: is it raining
Bot: i do not know, but i hope the sun is out.
User: do you like cats
Bot: yes, cats are soft and quiet. they like to sleep in the sun.
User: do you like dogs
Bot: yes, dogs are friendly. they like to play and run.
User: what is the weather like
Bot: the weather can be warm or cold. i hope it is nice where you are.
User: tell me a joke
Bot: why did the cat sit on the computer. it wanted to keep an eye on the mouse.
User: thank you
Bot: you are welcome. i am glad i could help.
User: what is a computer
Bot: a computer is a machine that can follow steps and remember things.
User: can you help me
Bot: yes, i will try my best to help you.
User: what is your job
Bot: my job is to talk with you and learn new words.
User: i feel sad
Bot: i am sorry. talking with a friend can help a little.
User: i feel happy
Bot: that is wonderful. i am glad you feel happy today.
User: what should i eat
Bot: you could eat fruit, bread, or soup. eat what makes you feel good.
User: where do birds live
Bot: birds live in trees, in nests, and in the sky.
User: how old are you
Bot: i am very new. i learned everything just now.
User: goodbye
Bot: goodbye. come back and talk again soon.
`.trim().toLowerCase();

// ---------- Vocabulary ----------
const chars = [...new Set(CORPUS)].sort();
const stoi = {}, itos = {};
chars.forEach((c, i) => { stoi[c] = i; itos[i] = c; });
const V = chars.length;

// ---------- Hyperparameters ----------
const CTX = 16;        // characters of context
const EMB = 8;         // embedding size per character
const H = 256;         // hidden neurons
const STEPS = 600;
const BATCH = 8;
const LR0 = 0.05;

// ---------- Parameters ----------
function randn(scale) {
  // Box-Muller
  const u = 1 - Math.random(), v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * scale;
}
function matrix(rows, cols, scale) {
  const m = [];
  for (let i = 0; i < rows; i++) {
    const r = [];
    for (let j = 0; j < cols; j++) r.push(new Value(randn(scale)));
    m.push(r);
  }
  return m;
}
function vector(n) {
  const v = [];
  for (let i = 0; i < n; i++) v.push(new Value(0));
  return v;
}

let E, W1, b1, W2, b2, params;
function initModel() {
  E = matrix(V, EMB, 0.1);
  W1 = matrix(H, CTX * EMB, Math.sqrt(2 / (CTX * EMB)));
  b1 = vector(H);
  W2 = matrix(V, H, Math.sqrt(1 / H));
  b2 = vector(V);
  params = [...E.flat(), ...W1.flat(), ...b1, ...W2.flat(), ...b2];
}

// ---------- Forward pass ----------
function forward(ctxIdx) {
  // ctxIdx: array of CTX character indices
  const x = [];
  for (const idx of ctxIdx) for (let k = 0; k < EMB; k++) x.push(E[idx][k]);

  const h = [];
  for (let i = 0; i < H; i++) {
    let s = b1[i];
    const row = W1[i];
    for (let j = 0; j < x.length; j++) s = s.add(row[j].mul(x[j]));
    h.push(s.relu());
  }

  const logits = [];
  for (let i = 0; i < V; i++) {
    let s = b2[i];
    const row = W2[i];
    for (let j = 0; j < H; j++) s = s.add(row[j].mul(h[j]));
    logits.push(s);
  }
  return logits;
}

// Cross-entropy with numerically stable softmax
function crossEntropy(logits, target) {
  let maxV = -Infinity;
  for (const l of logits) if (l.data > maxV) maxV = l.data;
  let sumExp = new Value(0);
  for (const l of logits) sumExp = sumExp.add(l.sub(maxV).exp());
  const logProb = logits[target].sub(maxV).sub(sumExp.log());
  return logProb.neg();
}

// ---------- Data batches ----------
const ENCODED = [...CORPUS].map(c => stoi[c]);
function sampleExample() {
  const start = Math.floor(Math.random() * (ENCODED.length - CTX - 1));
  return {
    ctx: ENCODED.slice(start, start + CTX),
    target: ENCODED[start + CTX]
  };
}

// ---------- Training (chunked so the UI stays responsive) ----------
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const trainBtn = document.getElementById('trainBtn');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('sendBtn');
let trained = false;

function log(s) {
  logEl.textContent += s + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function train() {
  trainBtn.disabled = true;
  trained = false;
  statusEl.textContent = 'Training...';
  logEl.textContent = '';
  initModel();
  log(`Vocabulary size: ${V}, parameters: ${params.length}`);

  let step = 0;
  function chunk() {
    const t0 = performance.now();
    while (step < STEPS && performance.now() - t0 < 100) {
      const lr = LR0 * (1 - step / STEPS) + 0.001;
      let batchLoss = new Value(0);
      for (let b = 0; b < BATCH; b++) {
        const ex = sampleExample();
        const logits = forward(ex.ctx);
        batchLoss = batchLoss.add(crossEntropy(logits, ex.target));
      }
      batchLoss = batchLoss.div(BATCH);

      for (const p of params) p.grad = 0;
      batchLoss.backward();
      for (const p of params) p.data -= lr * p.grad;

      if (step % 50 === 0) log(`step ${step} loss ${batchLoss.data.toFixed(4)}`);
      step++;
    }
    if (step < STEPS) {
      statusEl.textContent = `Training... ${Math.round(100 * step / STEPS)}%`;
      setTimeout(chunk, 0);
    } else {
      log('Done.');
      statusEl.textContent = 'Trained';
      trained = true;
      trainBtn.disabled = false;
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }
  chunk();
}

// ---------- Generation ----------
const tempSlider = document.getElementById('temp');
const tempVal = document.getElementById('tempVal');
tempSlider.oninput = () => tempVal.textContent = tempSlider.value;

function sampleFrom(logits, temperature) {
  const scaled = logits.map(l => l.data / temperature);
  const maxV = Math.max(...scaled);
  const exps = scaled.map(s => Math.exp(s - maxV));
  const total = exps.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < exps.length; i++) {
    r -= exps[i];
    if (r <= 0) return i;
  }
  return exps.length - 1;
}

function reply(userText) {
  const prompt = `user: ${userText.toLowerCase()}\nbot: `;
  let context = prompt.slice(-CTX).padStart(CTX, ' ');
  let out = '';
  const temperature = parseFloat(tempSlider.value);

  for (let i = 0; i < 200; i++) {
    const idxs = [...context].map(c => stoi[c] !== undefined ? stoi[c] : stoi[' ']);
    const logits = forward(idxs);
    const next = itos[sampleFrom(logits, temperature)];
    if (next === '\n') break;
    out += next;
    context = context.slice(1) + next;
  }
  return out.trim();
}

function addMessage(who, text) {
  const chat = document.getElementById('chat');
  chat.textContent += `${who}: ${text}\n\n`;
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  const text = msgInput.value.trim();
  if (!text || !trained) return;
  msgInput.value = '';
  addMessage('You', text);
  const answer = reply(text);
  addMessage('Bot', answer || '...');
}

trainBtn.onclick = train;
sendBtn.onclick = send;
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
