<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tiny Code Model</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; background: #fafafa; color: #222; }
  textarea { width: 100%; height: 140px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
  input[type=text] { width: 70%; font-family: monospace; font-size: 14px; padding: 6px; }
  button { padding: 6px 14px; font-size: 14px; cursor: pointer; }
  #log { background: #111; color: #9f9; font-family: monospace; font-size: 12px; padding: 8px; height: 120px; overflow-y: auto; white-space: pre; }
  #output { background: #fff; border: 1px solid #ccc; font-family: monospace; font-size: 14px; padding: 10px; white-space: pre-wrap; min-height: 120px; }
  .row { margin: 12px 0; }
</style>
</head>
<body>
<h2>Tiny Code Model (trained from scratch)</h2>
<p>A character-level neural network built on a custom autograd engine. It learns from the JavaScript snippets below, then continues whatever prompt you type. Expect short, rough output.</p>

<div class="row">
  <label>Training corpus (edit or replace freely):</label>
  <textarea id="corpus"></textarea>
</div>

<div class="row">
  <button id="trainBtn">Train</button>
  <span id="status">Not trained yet.</span>
</div>

<div id="log"></div>

<div class="row">
  <input type="text" id="prompt" value="function " placeholder="Type a code prompt">
  <label>Temp <input type="number" id="temp" value="0.8" step="0.1" min="0.1" max="2" style="width:60px"></label>
  <label>Length <input type="number" id="len" value="200" min="20" max="1000" style="width:70px"></label>
  <button id="genBtn" disabled>Generate</button>
</div>
<div id="output"></div>

<script>
// ---------- Autograd engine ----------
class Value {
  constructor(data, children = [], op = '') {
    this.data = data;
    this.grad = 0;
    this._prev = children;
    this._backward = () => {};
    this._op = op;
  }
  add(other) {
    other = other instanceof Value ? other : new Value(other);
    const out = new Value(this.data + other.data, [this, other], '+');
    out._backward = () => {
      this.grad += out.grad;
      other.grad += out.grad;
    };
    return out;
  }
  mul(other) {
    other = other instanceof Value ? other : new Value(other);
    const out = new Value(this.data * other.data, [this, other], '*');
    out._backward = () => {
      this.grad += other.data * out.grad;
      other.grad += this.data * out.grad;
    };
    return out;
  }
  pow(k) {
    const out = new Value(Math.pow(this.data, k), [this], 'pow');
    out._backward = () => {
      this.grad += k * Math.pow(this.data, k - 1) * out.grad;
    };
    return out;
  }
  relu() {
    const out = new Value(this.data > 0 ? this.data : 0, [this], 'relu');
    out._backward = () => {
      this.grad += (this.data > 0 ? 1 : 0) * out.grad;
    };
    return out;
  }
  exp() {
    const e = Math.exp(this.data);
    const out = new Value(e, [this], 'exp');
    out._backward = () => {
      this.grad += e * out.grad;
    };
    return out;
  }
  log() {
    const out = new Value(Math.log(this.data), [this], 'log');
    out._backward = () => {
      this.grad += (1 / this.data) * out.grad;
    };
    return out;
  }
  neg() { return this.mul(-1); }
  sub(other) { return this.add(other instanceof Value ? other.neg() : -other); }
  div(other) { return this.mul(other instanceof Value ? other.pow(-1) : 1 / other); }

  backward() {
    const topo = [];
    const visited = new Set();
    const build = (v) => {
      if (!visited.has(v)) {
        visited.add(v);
        for (const c of v._prev) build(c);
        topo.push(v);
      }
    };
    build(this);
    this.grad = 1;
    for (let i = topo.length - 1; i >= 0; i--) topo[i]._backward();
  }
}

// ---------- Random helpers ----------
function randn(std = 0.1) {
  // Box-Muller
  const u = 1 - Math.random(), v = Math.random();
  return std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function matrix(rows, cols) {
  const m = [];
  for (let i = 0; i < rows; i++) {
    const row = [];
    for (let j = 0; j < cols; j++) row.push(new Value(randn(0.1)));
    m.push(row);
  }
  return m;
}

// ---------- Default corpus ----------
const DEFAULT_CORPUS = `
const x = 5;
let name = "Ada";
var total = 0;
function add(a, b) {
  return a + b;
}
function square(n) {
  return n * n;
}
function greet(name) {
  return "Hello, " + name + "!";
}
for (let i = 0; i < 10; i++) {
  console.log(i);
}
const nums = [1, 2, 3, 4, 5];
const doubled = nums.map(n => n * 2);
const evens = nums.filter(n => n % 2 === 0);
function sum(arr) {
  let s = 0;
  for (const v of arr) {
    s += v;
  }
  return s;
}
function max(arr) {
  let m = arr[0];
  for (let i = 1; i < arr.length; i++) {
    if (arr[i] > m) m = arr[i];
  }
  return m;
}
function isEven(n) {
  return n % 2 === 0;
}
function factorial(n) {
  if (n <= 1) return 1;
  return n * factorial(n - 1);
}
const person = { name: "Bob", age: 30 };
console.log(person.name);
function reverse(s) {
  return s.split("").reverse().join("");
}
function countVowels(s) {
  let count = 0;
  for (const ch of s) {
    if ("aeiou".includes(ch)) count++;
  }
  return count;
}
class Counter {
  constructor() {
    this.count = 0;
  }
  increment() {
    this.count++;
  }
}
const c = new Counter();
c.increment();
while (total < 5) {
  total += 1;
}
function fib(n) {
  let a = 0, b = 1;
  for (let i = 0; i < n; i++) {
    [a, b] = [b, a + b];
  }
  return a;
}
const upper = str => str.toUpperCase();
function clamp(v, lo, hi) {
  return Math.min(Math.max(v, lo), hi);
}
if (x > 3) {
  console.log("big");
} else {
  console.log("small");
}
function findIndex(arr, target) {
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === target) return i;
  }
  return -1;
}
const squares = [];
for (let i = 1; i <= 5; i++) {
  squares.push(i * i);
}
function average(arr) {
  return sum(arr) / arr.length;
}
const obj = { a: 1, b: 2 };
for (const key in obj) {
  console.log(key, obj[key]);
}
`;

document.getElementById('corpus').value = DEFAULT_CORPUS.trim() + '\n';

// ---------- Model ----------
const CONTEXT = 8;     // characters of context
const EMB = 8;         // embedding size
const HIDDEN = 48;     // hidden units
const LR = 0.05;

let chars = [], stoi = {}, itos = {};
let C, W1, b1, W2, b2;      // parameters
let params = [];

function buildVocab(text) {
  chars = [...new Set(text)].sort();
  stoi = {}; itos = {};
  chars.forEach((ch, i) => { stoi[ch] = i; itos[i] = ch; });
}

function initParams(vocabSize) {
  C = matrix(vocabSize, EMB);
  W1 = matrix(CONTEXT * EMB, HIDDEN);
  b1 = [];
  for (let j = 0; j < HIDDEN; j++) b1.push(new Value(0));
  W2 = matrix(HIDDEN, vocabSize);
  b2 = [];
  for (let j = 0; j < vocabSize; j++) b2.push(new Value(0));
  params = [];
  for (const row of C) params.push(...row);
  for (const row of W1) params.push(...row);
  params.push(...b1);
  for (const row of W2) params.push(...row);
  params.push(...b2);
}

// Forward pass: context = array of char indices (length CONTEXT); returns logits Values
function forward(ctx) {
  // Gather embeddings
  const x = [];
  for (const idx of ctx) {
    for (let k = 0; k < EMB; k++) x.push(C[idx][k]);
  }
  // Hidden layer
  const h = [];
  for (let j = 0; j < HIDDEN; j++) {
    let s = b1[j];
    for (let i = 0; i < x.length; i++) s = s.add(x[i].mul(W1[i][j]));
    h.push(s.relu());
  }
  // Output logits
  const logits = [];
  for (let j = 0; j < chars.length; j++) {
    let s = b2[j];
    for (let i = 0; i < HIDDEN; i++) s = s.add(h[i].mul(W2[i][j]));
    logits.push(s);
  }
  return logits;
}

// Cross-entropy loss for one target
function lossFor(ctx, target) {
  const logits = forward(ctx);
  // Numerically stable softmax: subtract max
  let maxv = -Infinity;
  for (const l of logits) if (l.data > maxv) maxv = l.data;
  let denom = new Value(0);
  const exps = logits.map(l => {
    const e = l.add(-maxv).exp();
    denom = denom.add(e);
    return e;
  });
  const p = exps[target].div(denom);
  return p.log().neg();
}

// ---------- Training (chunked so the page stays responsive) ----------
const logEl = document.getElementById('log');
function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

let encoded = [];
let trainedFlag = false;

function encodeCorpus(text) {
  return [...text].map(ch => stoi[ch]);
}

function pickSample() {
  const start = Math.floor(Math.random() * (encoded.length - CONTEXT - 1));
  const ctx = encoded.slice(start, start + CONTEXT);
  const target = encoded[start + CONTEXT];
  return { ctx, target };
}

function train(totalSteps = 1500) {
  const text = document.getElementById('corpus').value;
  buildVocab(text);
  encoded = encodeCorpus(text);
  initParams(chars.length);
  logEl.textContent = '';
  log(`Vocab size: ${chars.length}, corpus chars: ${encoded.length}, parameters: ${params.length}`);
  document.getElementById('status').textContent = 'Training...';
  document.getElementById('trainBtn').disabled = true;
  document.getElementById('genBtn').disabled = true;

  let step = 0;
  const BATCH = 4;
  const chunk = () => {
    const chunkEnd = Math.min(step + 20, totalSteps);
    for (; step < chunkEnd; step++) {
      // Build batch loss
      let total = new Value(0);
      for (let b = 0; b < BATCH; b++) {
        const { ctx, target } = pickSample();
        total = total.add(lossFor(ctx, target));
      }
      const avg = total.mul(1 / BATCH);

      // Zero grads, backprop
      for (const p of params) p.grad = 0;
      avg.backward();

      // SGD step with decaying learning rate
      const lr = LR * (1 - step / totalSteps) + 0.005;
      for (const p of params) p.data -= lr * p.grad;

      if (step % 100 === 0 || step === totalSteps - 1) {
        log(`step ${String(step).padStart(5)}  loss ${avg.data.toFixed(4)}`);
      }
    }
    if (step < totalSteps) {
      document.getElementById('status').textContent = `Training... ${Math.round(100 * step / totalSteps)}%`;
      setTimeout(chunk, 0);
    } else {
      trainedFlag = true;
      document.getElementById('status').textContent = 'Trained.';
      document.getElementById('trainBtn').disabled = false;
      document.getElementById('genBtn').disabled = false;
      log('Done.');
    }
  };
  setTimeout(chunk, 0);
}

// ---------- Generation ----------
function sampleFrom(logits, temp) {
  const scaled = logits.map(l => l.data / temp);
  const m = Math.max(...scaled);
  const exps = scaled.map(s => Math.exp(s - m));
  const total = exps.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < exps.length; i++) {
    r -= exps[i];
    if (r <= 0) return i;
  }
  return exps.length - 1;
}

function generate() {
  const prompt = document.getElementById('prompt').value;
  const temp = parseFloat(document.getElementById('temp').value) || 0.8;
  const maxLen = parseInt(document.getElementById('len').value) || 200;
  const outEl = document.getElementById('output');

  // Build context from prompt, padding with first char if too short
  let text = prompt;
  const pad = stoi[' '] !== undefined ? stoi[' '] : 0;
  let ctx = [...text].map(ch => (stoi[ch] !== undefined ? stoi[ch] : pad));
  while (ctx.length < CONTEXT) ctx.unshift(pad);

  let out = prompt;
  for (let i = 0; i < maxLen; i++) {
    const window = ctx.slice(-CONTEXT);
    const logits = forward(window);
    const next = sampleFrom(logits, temp);
    ctx.push(next);
    out += itos[next];
  }
  outEl.textContent = out;
}

// ---------- Wire up ----------
document.getElementById('trainBtn').addEventListener('click', () => train(1500));
document.getElementById('genBtn').addEventListener('click', () => {
  if (!trainedFlag) return;
  generate();
});
</script>
</body>
</html>
